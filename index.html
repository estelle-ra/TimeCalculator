<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>협업 시차 계산기</title>
    <meta
      name="description"
      content="서울, 뉴욕, LA 크루가 함께 회의 시간을 맞추는 협업 시차 계산기"
    />
    <link rel="stylesheet" href="./styles.css?v=20260611-6" />
  </head>
  <body>
    <main class="app-shell">
      <section class="top-band" aria-label="현재 시간" data-i18n-aria="currentTime">
        <div>
          <p class="eyebrow" data-i18n="eyebrow">Collaboration Time Calculator</p>
          <h1 data-i18n="appTitle">협업 시차 계산기</h1>
          <div class="language-switch" aria-label="Language mode">
            <span data-i18n="language">언어</span>
            <button class="lang-button is-active" type="button" data-lang-option="ko">KR</button>
            <button class="lang-button" type="button" data-lang-option="en">EN</button>
          </div>
        </div>
        <div class="live-clock-panel">
          <div class="live-clock-heading" data-i18n="now">NOW</div>
          <div class="live-clocks" id="liveClocks" aria-live="polite"></div>
        </div>
      </section>

      <section class="control-grid" aria-label="회의 기준 시간 설정" data-i18n-aria="meetingSettings">
        <form class="panel control-panel" id="timeForm">
          <div class="panel-heading">
            <div>
              <p class="section-kicker" data-i18n="base">기준</p>
              <h2 data-i18n="meetingStart">회의 시작</h2>
            </div>
            <button class="text-button" id="nowButton" type="button" data-i18n="current">현재</button>
          </div>

          <label class="field">
            <span data-i18n="baseRegion">기준 지역</span>
            <select id="baseZone"></select>
          </label>

          <div class="split-fields">
            <label class="field">
              <span data-i18n="date">날짜</span>
              <input id="baseDate" type="date" />
            </label>
            <label class="field">
              <span data-i18n="time">시간</span>
              <div class="time-picker" id="baseTimePicker">
                <button class="time-picker-button" id="baseTimeButton" type="button" aria-expanded="false" aria-controls="baseTimeMenu">
                  00:00
                </button>
                <input id="baseTime" type="hidden" />
                <div class="time-picker-menu" id="baseTimeMenu" hidden>
                  <label>
                    <span data-i18n="hourSelect">시</span>
                    <select id="baseTimeHour"></select>
                  </label>
                  <label>
                    <span data-i18n="minuteSelect">분</span>
                    <select id="baseTimeMinute"></select>
                  </label>
                </div>
              </div>
            </label>
          </div>

          <div class="range-block">
            <div class="range-meta">
              <span data-i18n="moveWithinDay">하루 안에서 이동</span>
              <strong id="sliderLabel">00:00</strong>
            </div>
            <input
              id="timeSlider"
              type="range"
              min="0"
              max="1439"
              step="15"
              aria-label="회의 시작 시간 조정"
              data-i18n-aria="meetingTimeAdjust"
            />
            <div class="range-actions">
              <button type="button" class="icon-button" id="minus15" title="15분 전" data-i18n-title="minus15Title">
                -15
              </button>
              <button type="button" class="icon-button" id="plus15" title="15분 후" data-i18n-title="plus15Title">
                +15
              </button>
            </div>
          </div>

          <label class="field">
            <span data-i18n="meetingLength">회의 길이</span>
            <select id="duration">
              <option value="15" data-duration-label="15">15분</option>
              <option value="30" data-duration-label="30">30분</option>
              <option value="45" data-duration-label="45">45분</option>
              <option value="60" data-duration-label="60" selected>1시간</option>
              <option value="90" data-duration-label="90">1시간 30분</option>
              <option value="120" data-duration-label="120">2시간</option>
              <option value="180" data-duration-label="180">3시간</option>
            </select>
          </label>

          <fieldset class="participants-block">
            <legend data-i18n="participants">참여 지역</legend>
            <div class="participants-list" id="participants"></div>
          </fieldset>

          <details class="work-hours-block">
            <summary class="work-hours-summary">
              <div>
                <span data-i18n="editWorkHours">업무시간 수정</span>
                <small data-i18n="workHoursDefaultHint">기본값 10:00-19:00 · 타협 ±2시간</small>
              </div>
              <span class="summary-icon" aria-hidden="true"></span>
            </summary>
            <div class="work-hours-content">
              <div class="work-hours-heading">
                <div>
                  <span data-i18n="regionalWorkHours">지역별 업무 기준</span>
                  <small data-i18n="weekendHolidayExcluded">주말과 공휴일은 업무시간에서 제외</small>
                </div>
              <button class="text-button" id="resetWorkHours" type="button" data-i18n="defaultValue">
                기본값
              </button>
              </div>
              <div class="work-hours-list" id="workHours"></div>
            </div>
          </details>
        </form>

        <aside class="panel summary-panel" aria-label="회의 요약" data-i18n-aria="meetingSummary">
          <div class="panel-heading">
            <div>
              <p class="section-kicker" data-i18n="judgment">판정</p>
              <h2 id="scoreTitle">팀 적합도</h2>
            </div>
            <span class="score-pill" id="scorePill">계산 중</span>
          </div>
          <div class="score-meter" aria-hidden="true">
            <span id="scoreMeter"></span>
          </div>
          <p class="share-line" id="shareText"></p>
          <div class="share-actions">
            <input id="shareInput" readonly aria-label="공유 문구" data-i18n-aria="shareTextLabel" />
            <button class="text-button" id="copyButton" type="button" data-i18n="copy">복사</button>
          </div>
        </aside>
      </section>

      <section class="board-grid" aria-label="지역별 시간" data-i18n-aria="timeByRegion">
        <div class="panel board-panel">
          <div class="panel-heading">
            <div>
              <p class="section-kicker" data-i18n="localTime">현지 시간</p>
              <h2 id="boardTitle">서울 · 뉴욕 · LA</h2>
            </div>
            <span class="hint" id="workHint">업무 기준 적용</span>
          </div>
          <div class="zone-list" id="zoneList"></div>
        </div>

        <aside class="panel suggestion-panel" aria-label="추천 회의 시간" data-i18n-aria="recommendedMeetingTimes">
          <div class="panel-heading">
            <div>
              <p class="section-kicker" data-i18n="recommendation">추천</p>
              <h2 data-i18n="sameDayCandidates">같은 날짜 후보</h2>
            </div>
            <span class="hint" data-i18n="thirtyMinuteInterval">30분 간격</span>
          </div>
          <div class="suggestions" id="suggestions"></div>
        </aside>
      </section>
    </main>

    <script src="./app.js?v=20260611-9"></script>
  </body>
</html>
